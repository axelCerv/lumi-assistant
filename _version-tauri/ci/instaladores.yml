# Genera los instaladores de Lumi para Mac (.dmg) y Windows (.exe).
#
# - Manual: GitHub → pestaña Actions → "Instaladores" → Run workflow.
#   Los instaladores quedan en el resumen de la ejecución, en "Artifacts".
# - Con versión: crea una etiqueta y súbela (git tag v0.1.0 && git push --tags).
#   Se arma un borrador de Release con los dos instaladores adjuntos.
name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: mac
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: windows-latest
            name: windows
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # En Mac se compila para Apple Silicon e Intel a la vez (app universal)
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Lumi ${{ github.ref_name }}"
          releaseBody: "Descarga el .dmg para Mac o el -setup.exe para Windows."
          releaseDraft: true
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: lumi-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
